version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: inp
      POSTGRES_PASSWORD: inp123
      POSTGRES_DB: inp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inp"]
      interval: 5s
      timeout: 5s
      retries: 5

  inp-server:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: inp
      DB_PASSWORD: inp123
      DB_NAME: inp
      INP_REGISTRATION_SECRET: inp-super-secret-registration-token-2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mock-payment:
    build: .
    command: npm run mock-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      GATEWAY_URL: http://inp-server:3000
      SELF_ENDPOINT: http://mock-payment:3001
      INP_REGISTRATION_SECRET: inp-super-secret-registration-token-2026
    depends_on:
      - inp-server
    restart: unless-stopped

  mock-inventory:
    build: .
    command: npm run mock-inventory
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      GATEWAY_URL: http://inp-server:3000
      SELF_ENDPOINT: http://mock-inventory:3002
      INP_REGISTRATION_SECRET: inp-super-secret-registration-token-2026
    depends_on:
      - inp-server
    restart: unless-stopped

  mock-notification:
    build: .
    command: npm run mock-notification
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      GATEWAY_URL: http://inp-server:3000
      SELF_ENDPOINT: http://mock-notification:3003
      INP_REGISTRATION_SECRET: inp-super-secret-registration-token-2026
    depends_on:
      - inp-server
    restart: unless-stopped

volumes:
  postgres_data: